<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">医学经历编译流程</title>
  <desc id="desc">从真实经历到可核查简历要点的四步流程</desc>
  <rect width="1200" height="270" rx="24" fill="#f3f7f4"/>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <text x="70" y="58" fill="#245a47" font-size="18" font-weight="700" letter-spacing="2">MEDICAL EXPERIENCE COMPILER</text>
    <g transform="translate(72 95)">
      <g><rect width="210" height="104" rx="16" fill="#fff" stroke="#c8ddd0"/><text x="105" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1d3e2f">真实经历</text><text x="105" y="70" text-anchor="middle" font-size="14" fill="#63786c">输入原话，不先夸大</text></g>
      <path d="M228 52H278" stroke="#84ad96" stroke-width="3"/><path d="M278 52l-10-8v16z" fill="#84ad96"/>
      <g transform="translate(294)"><rect width="210" height="104" rx="16" fill="#fff" stroke="#c8ddd0"/><text x="105" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1d3e2f">确认事实</text><text x="105" y="70" text-anchor="middle" font-size="14" fill="#63786c">方法、角色、交付物</text></g>
      <path d="M522 52H572" stroke="#84ad96" stroke-width="3"/><path d="M572 52l-10-8v16z" fill="#84ad96"/>
      <g transform="translate(588)"><rect width="210" height="104" rx="16" fill="#fff" stroke="#c8ddd0"/><text x="105" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1d3e2f">目标路径</text><text x="105" y="70" text-anchor="middle" font-size="14" fill="#63786c">科研、临床、MSL、数据</text></g>
      <path d="M816 52H866" stroke="#84ad96" stroke-width="3"/><path d="M866 52l-10-8v16z" fill="#84ad96"/>
      <g transform="translate(882)"><rect width="210" height="104" rx="16" fill="#245a47"/><text x="105" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">可信要点</text><text x="105" y="70" text-anchor="middle" font-size="14" fill="#dbece1">可追溯、可编辑</text></g>
    </g>
  </g>
</svg>
