<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>医学经历工作区</title><link rel="stylesheet" href="styles.css"></head>
<body class="conversation-workspace"><header><a href="../index.html">未界</a><span>医学经历工作区 · Beta</span><button id="newConversation" class="header-action" type="button">新建经历</button></header>
<main class="conversation-layout"><section class="chat-pane"><small>CONFIRMED FACTS FIRST</small><h1>把真实经历说出来，<br>再把它写进简历。</h1><p class="subtle">聊天用于梳理；事实确认与 claim 审计决定哪些内容可以进入预览。</p><div id="messages" class="messages" aria-live="polite"></div><div id="factCard" class="embedded-card hidden"></div><div id="roleChips" class="chips hidden"><span class="subtle">选择目标方向后立即生成并审计：</span><button data-role="doctoral_v1">学术科研</button><button data-role="clinical_research_v1">临床研究</button><button data-role="medical_affairs_v1">医学事务</button><button data-role="health_ai_data_v1">医疗数据</button></div><label class="consent"><input id="consent" type="checkbox"> 我确认所述经历真实准确，并同意在本机服务中处理。</label><form id="messageForm"><textarea id="messageInput" rows="3" placeholder="例如：我在导师指导下参与 Meta 分析，使用 PubMed 和 R 完成检索、筛选和敏感性分析。"></textarea><button class="primary" type="submit">发送</button></form><p id="error" class="error"></p></section><aside class="preview-pane"><div class="preview-head"><div><small>LIVE RESUME</small><h2>实时简历预览</h2></div><a id="openResumeBeta" href="../resume-beta/index.html">打开 A4 简历</a></div><p class="subtle">仅展示已确认且 ClaimGate 为 ready 的内容。</p><div id="audit" class="audit"></div><div id="resumePreview" class="resume-preview"></div></aside></main><script src="app.js"></script></body></html>
