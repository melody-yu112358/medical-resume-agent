[project]
name = "medical-career-agent"
version = "0.1.0"
description = "Evidence-based career transition agent for medical students"
requires-python = ">=3.11"
dependencies = ["flask>=3.0,<4", "gunicorn>=23,<24"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
resume_extract = ["pypdf>=5.0,<6", "python-docx>=1.1,<2"]
schema_validation = ["jsonschema>=4.20,<5"]

[tool.setuptools.package-data]
medical_career_agent = ["assets/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
